# The Persei bundle: one command, any host with Docker.
#
#   cp docker/.env.example .env   # set OPENROUTER_API_KEY and PROJECTS_DIR
#   docker compose up -d
#   open http://localhost:8100
#
# See docs/roadmap-packaging.md for why this exists and what it does not cover
# yet (a GitHub-only project is cloned onto this machine; there is no remote
# execution).

# Every built service names its image (tektonix-agent:latest and so on)
# and has pull_policy: build, so a source checkout's `docker compose up -d`
# builds what changed (from cache: seconds when nothing did) and never
# tries to pull that name from Docker Hub. The desktop app pulls the same
# release from ghcr.io/djg3dk/tektonix-<service>, tags it with that name,
# and runs `up -d --no-build`, which uses what is there. One file for both.
# .github/workflows/release.yml publishes the images.
#
# The compose project name: every container, network and volume is
# tektonix-<service>-1, tektonix_checks, tektonix_pgdata. An install made
# before 2026-09-28 was three-d-agent; keep its data by putting
# COMPOSE_PROJECT_NAME=three-d-agent and POSTGRES_DB=three_d_agent in .env.
#
# Who runs as what: the router runs as its own unprivileged user always
# (docker/router/entrypoint.sh). The agent and the two review services
# write into PROJECTS_DIR, so on Linux they should run as the operator:
# PUID and PGID in .env (`id -u`, `id -g`), and their entrypoints drop to
# that user after fixing up the volumes' ownership. Unset, they stay root,
# which is what Docker Desktop's bind mounts need and what every install
# before 2026-09-29 had.
name: tektonix

# Container logs are json-file by default and grow without bound; a busy
# agent writes gigabytes in a month. Ten files of ten megabytes each.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "10"

services:
  postgres:
    image: postgres:16-alpine
    # First, so the generated secrets exist before any service that reads
    # them starts: everything else waits for this one to be healthy. See
    # docker/postgres/init-secrets.sh.
    entrypoint: ["/bin/sh", "/tektonix/init-secrets.sh"]
    command: ["postgres"]
    environment:
      POSTGRES_USER: agent
      # Blank means "generate one". The old compose defaults (`agent`,
      # `sk-local-dev`) were the same in every installation.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      MODEL_ROUTER_KEY: ${MODEL_ROUTER_KEY:-}
      POSTGRES_DB: ${POSTGRES_DB:-tektonix}
      TEKTONIX_PG_SECRET_DIR: /run/tektonix-pg
      TEKTONIX_ROUTER_KEY_DIR: /run/tektonix-router
      TEKTONIX_LEGACY_SECRETS_DIR: /run/tektonix-secrets
    volumes:
      - pgdata:/var/lib/postgresql/data
      # One volume per secret, each mounted only where it is read: the
      # router and the reviewer never see the database password. Before
      # 2026-09-29 both lived in `bundlesecrets`, which every consumer
      # mounted whole; it stays mounted here alone so an upgrade carries
      # its values over (init-secrets.sh copies them on first start).
      - pgsecret:/run/tektonix-pg
      - routerkey:/run/tektonix-router
      - bundlesecrets:/run/tektonix-secrets
      - ./docker/postgres/init-secrets.sh:/tektonix/init-secrets.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d ${POSTGRES_DB:-tektonix}"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging
    restart: unless-stopped

  router:
    image: tektonix-router:latest
    pull_policy: build
    build:
      context: .
      dockerfile: docker/router/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env}
      MODEL_ROUTER_KEY_FILE: /run/tektonix-router/model_router_key
    # Image HEALTHCHECK already probes /health/liveliness. Named here so the
    # agent's depends_on can wait on it: a first task that starts while the
    # router is still booting dies mid-call with "peer closed connection".
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4001/health/liveliness"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    volumes:
      # The operator's own pins when they have them, the committed example when
      # they do not. This was an unconditional mount of config.yaml, which is
      # gitignored and therefore absent from every fresh clone and every
      # release tarball -- Docker then creates a DIRECTORY at the missing
      # source and the router dies on "are you trying to mount a directory
      # onto a file". `docker compose up` in a fresh tree could not start.
      # Pointing the default at a file that is always there fixes it; set
      # ROUTER_CONFIG in .env to use your own.
      # ...as the SEED. The live file is config.yaml in the routerconfig
      # volume, which the agent shares: the Models page writes pins there
      # and the router re-reads it on its next call. The entrypoint copies
      # the seed in on first boot only (docker/router/entrypoint.sh), so
      # pins set from the dashboard outlive a restart and an upgrade.
      - ${ROUTER_CONFIG:-./services/model-router/config.example.yaml}:/app/config.seed.yaml:ro
      - routerconfig:/app/router-config
      - routerlogs:/app/logs
      - routerkey:/run/tektonix-router:ro
    logging: *logging
    restart: unless-stopped

  # The sandbox image every task and check runs in. Built here, with
  # compose's own progress on screen, before the agent starts. It used to be
  # built by the agent's entrypoint on first run, inside the agent's health
  # window: on a slow first download the agent was declared unhealthy before
  # it had started serving, and the whole stack failed (2026-09-28). The
  # container itself does nothing and exits at once; the image is the point.
  # (The agent's entrypoint still builds it when it is missing, which is
  # the desktop app's case: it pulls the release image and tags it, and
  # runs `up --no-build`.)
  sandbox-image:
    image: tektonix-sandbox:latest
    pull_policy: build
    build:
      context: ./docker/agent-sandbox
    entrypoint: ["true"]
    restart: "no"

  agent:
    image: tektonix-agent:latest
    pull_policy: build
    build:
      context: .
      dockerfile: docker/agent/Dockerfile
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      router:
        condition: service_healthy
      checks-postgres:
        condition: service_healthy
      checks-redis:
        condition: service_healthy
    environment:
      # The entrypoint builds LANGGRAPH_PG_DSN and MODEL_ROUTER_KEY from these
      # generated files; set LANGGRAPH_PG_DSN yourself to use another database.
      POSTGRES_PASSWORD_FILE: /run/tektonix-pg/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-tektonix}
      MODEL_ROUTER_KEY_FILE: /run/tektonix-router/model_router_key
      # Run as this user after the entrypoint's setup (see the header).
      PUID: ${PUID:-0}
      PGID: ${PGID:-0}
      # With /v1: the agent's OpenAI client appends /chat/completions to
      # this. Without it the first model call of the first task was the
      # router's 404 (2026-09-28).
      MODEL_ROUTER_URL: http://router:4001/v1
      # The router's live config and its ledger, shared through volumes: the
      # Models page edits the first, Analytics reads the second. Both used
      # to be host paths only a host install has, and the bundle's Models
      # page was a 500 (2026-09-28).
      MODEL_ROUTER_CONFIG_PATH: /app/router-config/config.yaml
      MODEL_ROUTER_LEDGER: /app/router-logs/routing.jsonl
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env}
      # Git needs an identity to commit and to merge, and a container has
      # none: the first Windows install's first task ended at its final
      # commit with "Please tell me who you are" (2026-09-28). The
      # operator's own name and address (GIT_USER_NAME / GIT_USER_EMAIL,
      # asked for by the app and the installer), so the commits are theirs;
      # the sign-in address when they gave none.
      GIT_AUTHOR_NAME: ${GIT_USER_NAME:-Persei}
      GIT_AUTHOR_EMAIL: ${GIT_USER_EMAIL:-${ADMIN_EMAIL:-admin@example.com}}
      GIT_COMMITTER_NAME: ${GIT_USER_NAME:-Persei}
      GIT_COMMITTER_EMAIL: ${GIT_USER_EMAIL:-${ADMIN_EMAIL:-admin@example.com}}
      # The two names themselves as well, so the Environment page (which
      # reads this container's environment in the bundle) shows them.
      GIT_USER_NAME: ${GIT_USER_NAME:-}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      DEFAULT_BUDGET_USD: ${DEFAULT_BUDGET_USD:-10.00}
      # Required by agent/config.py, and empty is a valid answer: without SMTP
      # a password reset is done against the database instead (INSTALL.md 6a).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # THE line that makes sibling containers work. The agent sees projects at
      # /projects; the host daemon, which actually resolves every bind mount,
      # sees them at PROJECTS_DIR. Without this the sandbox would mount empty
      # directories and every task would read an empty repo -- silently.
      # See agent/tools/sandbox.py's host_path().
      AGENT_HOST_PATH_MAP: /projects=${PROJECTS_DIR:?set PROJECTS_DIR in .env}
      # What a check or a shell command may use (agent/tools/sandbox.py).
      # The desktop app sets these from the machine's size.
      SANDBOX_CPUS: ${SANDBOX_CPUS:-2}
      SANDBOX_MEMORY: ${SANDBOX_MEMORY:-2g}
      # What the two review containers need from this one, and nothing
      # else: projects.json and the review-control secret, in a volume of
      # their own. They used to mount the whole data volume read-only, which
      # also holds AUTH_SECRET_KEY and the encrypted first password. The
      # entrypoint moves both files over on the first start after an upgrade.
      TEKTONIX_SHARED_DIR: /app/shared
      AGENT_PROJECTS_JSON: /app/shared/projects.json
      # Worktrees must live somewhere AGENT_HOST_PATH_MAP can translate, or
      # the sandbox asks the host daemon to mount a path that exists only
      # inside this container -- which succeeds, empty, and silently. The
      # default (/home/agent-workspaces) is exactly that. Under /projects it
      # is covered by the mapping already there, and nothing scans this root,
      # so a dot-directory stays out of the way.
      AGENT_SANDBOX_ROOT: /projects/.tektonix-workspaces
      # The commit reviewer's worktrees, which it asks this service to run
      # checks in (agent/review_sandbox.py). Under /projects for the same
      # reason as the workspaces above, and the same value the reviewer uses:
      # a request naming a worktree anywhere else is refused. Setting it is
      # also what enables that endpoint at all.
      REVIEW_WORKTREE_ROOT: /projects/.tektonix-review-worktrees
      # A project's db:drift, db:seed and test:e2e run in the checks
      # container on the private `checks` network, against the two throwaway
      # services below (agent/review_sandbox.py). The network is internal and
      # this service is NOT on it: a check can reach the two of them and
      # nothing else, and the agent sets each run up with `docker exec` into
      # the two containers (their names, and the URLs as a check sees them;
      # no password -- each run gets its own plain role). All five unset
      # means the reviewer refuses the database checks, as it did before
      # 2026-09-27.
      REVIEW_CHECKS_NETWORK: tektonix_checks
      REVIEW_CHECKS_POSTGRES_URL: postgresql://checks@checks-postgres:5432/postgres
      REVIEW_CHECKS_REDIS_URL: redis://checks-redis:6379
      REVIEW_CHECKS_POSTGRES_CONTAINER: tektonix-checks-postgres
      REVIEW_CHECKS_REDIS_CONTAINER: tektonix-checks-redis
      # The review services are siblings here, not localhost.
      REVIEW_SERVICE_HOST: agent-review
      REVIEW_CONTROL_HOST: commit-reviewer
      # The Environment page shows what compose provided and says the host's
      # .env is where a value changes (agent/env_config.py).
      TEKTONIX_BUNDLE: "1"
      # Set only by the desktop app, in its own .env: the single-user rules
      # (agent/auth.py, desktop_install). Empty here and on every other
      # install, which keeps the full sign-in.
      TEKTONIX_DESKTOP: ${TEKTONIX_DESKTOP:-}
      # Licensed features, from the host's .env (agent/features.py). The
      # explicit list here is what the container sees, so a switch missing
      # from it was a 403 no matter what the .env said (2026-09-29).
      TEKTONIX_FEATURES: ${TEKTONIX_FEATURES:-}
      # The desktop rules hold only while the dashboard is bound to this
      # machine alone; the agent checks the bind it was given (desktop_install).
      BIND_ADDRESS: ${BIND_ADDRESS:-127.0.0.1}
    volumes:
      # Sibling containers, not nested. See docker/agent/Dockerfile.
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PROJECTS_DIR:?set PROJECTS_DIR in .env}:/projects
      - agentdata:/app/data
      - reviewshared:/app/shared
      - agentlogs:/app/logs
      - routerconfig:/app/router-config
      - routerlogs:/app/router-logs:ro
      - pgsecret:/run/tektonix-pg:ro
      - routerkey:/run/tektonix-router:ro
      # The sandbox image's build context, for the entrypoint's fallback
      # build when the image is missing (compose builds it above; the
      # desktop app pulls it).
      - ./docker/agent-sandbox:/app/docker/agent-sandbox:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${AGENT_PORT:-8100}:8100"
    logging: *logging
    restart: unless-stopped

  # The review gate. This is the part that makes a merge mean something: one
  # model writes the code, a second reviews the branch, and only a READY
  # verdict merges. Leaving it out of the bundle meant the easiest install
  # produced an agent with no gate -- which is most of the product.
  #
  # The one thing that does NOT work here is deploying after a merge: pm2
  # runs on the host and a container cannot reach it. That endpoint says so
  # rather than failing (TEKTONIX_BUNDLE, services/agent-review/server.js).
  agent-review:
    image: tektonix-reviewer:latest
    pull_policy: build
    build:
      context: .
      dockerfile: docker/reviewer/Dockerfile
    depends_on:
      agent:
        condition: service_healthy
      router:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4100/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    environment:
      AGENT_HOME: /app
      AGENT_PROJECTS_JSON: /app/shared/projects.json
      REVIEW_STATE_DIR: /app/review-state
      # Written by the agent's entrypoint into the shared volume on first
      # run, so all three containers agree without it being in compose or in
      # anyone's shell history.
      REVIEW_CONTROL_SECRET_FILE: /app/shared/review_control_secret
      MODEL_ROUTER_URL: http://router:4001
      REVIEW_CONTROL_HOST: commit-reviewer
      # The dashboard's Router tab: the router's ledger (the routerlogs
      # volume, read-only, the same path the agent reads) and the upstream
      # key for the balance card. Both used to be read from host paths the
      # container does not have, so the tab was empty in the bundle.
      MODEL_ROUTER_LEDGER: /app/router-logs/routing.jsonl
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env}
      TEKTONIX_BUNDLE: "1"
      PUID: ${PUID:-0}
      PGID: ${PGID:-0}
      GIT_AUTHOR_NAME: ${GIT_USER_NAME:-Persei}
      GIT_AUTHOR_EMAIL: ${GIT_USER_EMAIL:-${ADMIN_EMAIL:-admin@example.com}}
      GIT_COMMITTER_NAME: ${GIT_USER_NAME:-Persei}
      GIT_COMMITTER_EMAIL: ${GIT_USER_EMAIL:-${ADMIN_EMAIL:-admin@example.com}}
    volumes:
      - ${PROJECTS_DIR:?set PROJECTS_DIR in .env}:/projects
      - reviewshared:/app/shared:ro
      - reviewstate:/app/review-state
      - routerlogs:/app/router-logs:ro
    logging: *logging
    restart: unless-stopped

  commit-reviewer:
    image: tektonix-reviewer:latest
    pull_policy: build
    build:
      context: .
      dockerfile: docker/reviewer/Dockerfile
    command: ["node", "services/commit-reviewer/reviewer.js"]
    depends_on:
      agent:
        condition: service_healthy
      router:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4101/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    environment:
      AGENT_HOME: /app
      AGENT_PROJECTS_JSON: /app/shared/projects.json
      REVIEW_STATE_DIR: /app/review-state
      REVIEW_CONTROL_SECRET_FILE: /app/shared/review_control_secret
      # The reviewer's own model call goes through the router like every other
      # call, so its choice and its spend are visible in one place.
      MODEL_ROUTER_URL: http://router:4001/v1
      MODEL_ROUTER_KEY_FILE: /run/tektonix-router/model_router_key
      TEKTONIX_BUNDLE: "1"
      PUID: ${PUID:-0}
      PGID: ${PGID:-0}
      GIT_AUTHOR_NAME: ${GIT_USER_NAME:-Persei}
      GIT_AUTHOR_EMAIL: ${GIT_USER_EMAIL:-${ADMIN_EMAIL:-admin@example.com}}
      GIT_COMMITTER_NAME: ${GIT_USER_NAME:-Persei}
      GIT_COMMITTER_EMAIL: ${GIT_USER_EMAIL:-${ADMIN_EMAIL:-admin@example.com}}
      # Checks run agent-authored code, and THIS container holds the secret
      # that authorises a merge -- so they never run here. The agent, which
      # has the docker socket, starts a sandbox container for each one
      # (services/commit-reviewer/sandbox.js), after a probe that the image is
      # there; the agent builds it on demand. Unset, every check refuses.
      AGENT_SANDBOX_URL: http://agent:8100
      # Under /projects so the agent can hand it to the host daemon, and the
      # same value the agent validates against.
      REVIEW_WORKTREE_ROOT: /projects/.tektonix-review-worktrees
    volumes:
      - ${PROJECTS_DIR:?set PROJECTS_DIR in .env}:/projects
      - reviewshared:/app/shared:ro
      - reviewstate:/app/review-state
      - routerkey:/run/tektonix-router:ro
    logging: *logging
    restart: unless-stopped

  # The database checks' own Postgres and Redis: throwaway, on the internal
  # `checks` network only, where the only other thing is the check container
  # of a review in flight. The agent is not on the network; it creates and
  # drops each review's role and database with `docker exec` into these
  # containers (fixed names, so it can). Data lives in memory; nothing here
  # outlives a restart, and nothing here is yours. The bootstrap password is
  # replaced with one nobody holds the moment the server is up
  # (docker/checks-postgres/init.sh): a check gets its own plain role, not
  # the superuser.
  checks-postgres:
    image: postgres:16-alpine
    container_name: tektonix-checks-postgres
    environment:
      POSTGRES_USER: checks
      POSTGRES_PASSWORD: checks
      POSTGRES_DB: postgres
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./docker/checks-postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    networks:
      - checks
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checks -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging
    restart: unless-stopped

  checks-redis:
    image: redis:8-alpine
    container_name: tektonix-checks-redis
    # One user, every check: Redis cannot bind a user to a database index,
    # so a run's own index is a convention (agent/review_sandbox.py). The
    # commands that reach past it -- FLUSHALL over every run's index, CONFIG,
    # DEBUG, SHUTDOWN, ACL -- are denied; FLUSHDB stays, the agent uses it
    # to clear one index per run. The health check's PING is unaffected.
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--user", "default", "on", "nopass", "~*", "&*", "+@all",
              "-flushall", "-config", "-debug", "-shutdown", "-acl"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - checks
    logging: *logging
    restart: unless-stopped

networks:
  default:
  # No gateway: a container on this network alone cannot reach the internet,
  # the host, or any service that is not also on it.
  #
  # Named outright, because the agent attaches each check container to it by
  # that name (REVIEW_CHECKS_NETWORK above). Left to compose, the name is
  # <project>_checks, and an install kept on the pre-rename project name
  # (COMPOSE_PROJECT_NAME=three-d-agent) got three-d-agent_checks: every
  # database check failed to attach.
  checks:
    name: tektonix_checks
    internal: true

# Ten named volumes. `docker compose down` keeps them; `down -v` destroys
# them. Worth backing up: pgdata, routerconfig, agentdata, and the two
# secret volumes (docs/backup.md, scripts/backup.sh --bundle). The rest is
# regenerated or is only logs. docker/README.md lists the same ten.
volumes:
  # The router's live config: the model pins the Models page writes.
  routerconfig:
  # Everything the agent remembers: tasks, memory, users.
  pgdata:
  # Verdicts and their history. Separate from agentdata because the agent owns
  # that one and these two write this one.
  reviewstate:
  # The generated database password, written by postgres's entrypoint
  # wrapper (init-secrets.sh) and read by the agent alone.
  pgsecret:
  # The generated router key, written there too; read by the router, the
  # agent and the commit reviewer.
  routerkey:
  # Where both of those lived before 2026-09-29. Mounted by postgres only,
  # so an upgrade keeps its password; empty on a fresh install.
  bundlesecrets:
  # The agent's own: AUTH_SECRET_KEY, the encrypted first password, the
  # daily jobs' markers. Nothing else mounts it.
  agentdata:
  # What the agent hands the two review services: projects.json and the
  # review-control secret. Read-only for them.
  reviewshared:
  agentlogs:
  # The router's ledger, one line per model call; the Analytics page reads it.
  routerlogs:

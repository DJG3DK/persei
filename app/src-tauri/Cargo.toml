[package]
name = "tektonix"
version = "0.9.0"
description = "Persei desktop: the dashboard in a window, the stack under it"
authors = ["Persei"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "tektonix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "rt-multi-thread", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "cookies"] }
futures-util = "0.3"
thiserror = "2"
url = "2"
# The release's image manifest is signed with the updater's key; these are
# what the updater itself verifies with.
minisign-verify = "0.3"
base64 = "0.23"
# The hash of Docker's install script as it arrives, checked again by the
# root shell that runs it (docker.rs linux_install_script).
sha2 = "0.10"

[dev-dependencies]
# Already in the tree through tauri; the tests show what its ordering
# does to release candidates.
semver = "1"
# The mock runtime, for the capability tests in lib.rs.
tauri = { version = "2", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

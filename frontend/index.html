<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover (audit M-21): without it env(safe-area-inset-*) is
         always 0 on iOS, making every --safe-* padding in the CSS inert. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- This is the CONSOLE's shell. It is private, it is behind a login, and
         it is not the page anyone should find in a search result -- the
         public page is its own build (site/) on its own host. So: noindex,
         and only the metadata a browser tab and an installed app need.

         The two were one document until 2026-09-17, which is why the
         marketing description, the Open Graph card and the structured data
         used to sit in front of a password box. They moved to site/index.html
         with the page they describe. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Sign in to the Persei console." />
    <link rel="canonical" href="https://agent.perseiagent.ai/" />
    <!-- Relative hrefs, kept from when this app was served under a /v2/
         sub-path: they resolve correctly at the root too, so there is nothing
         to change. No SVG icon — the hand-drawn cube SVG was illegible at
         16px (it shipped as mush on the demo site until replaced with these
         hand-tuned PNGs). -->
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <!-- Installable app (public/manifest.webmanifest + public/sw.js).
         Absolute hrefs here, unlike the icons above: the manifest's own scope
         is "/", and a manifest fetched from a deep link under a relative href
         would resolve its start_url against the wrong base.

         theme-color paints Android's status bar behind the app. It is --bg
         (#11151a) rather than --surface so the bar reads as part of the page
         instead of a slightly wrong-coloured strip above it.

         iOS ignores the manifest's display mode and uses these three instead.
         black-translucent puts the page UNDER the status bar, which is only
         correct because the viewport is already viewport-fit=cover and every
         top-edge padding in the CSS is env(safe-area-inset-top) -- without
         that pair the clock would sit on top of the header. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#11151a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Persei" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- A label on an operator's pinned tab, and the name the installed app
         shows. Not a headline: nobody arrives here to be told what the
         product is. -->
    <title>Persei</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

# Persei model router configuration -- EXAMPLE.
#
# This file is the seed for a fresh Persei install. It defines one entry
# per agent-* role in agent/model_config.py MANAGED_ROLES (the Models page's
# seats; tests/test_managed_roles_complete.py keeps the two lists in step),
# including agent-reviewer, which the commit-reviewer service resolves by
# alias, plus three unnamed fallback targets (deepseek-v4-pro,
# claude-haiku-4.5, gpt-4o-mini) that those roles may fail over to. Do not
# delete a fallback without checking router_settings.fallbacks.
#
# One alias is not a chat seat: `embedder`, which agent/embeddings.py asks for
# when semantic episode recall is switched on. It is here so that a fresh
# install can turn that on by setting one variable rather than by editing a
# config file it has never opened.
#
# The SIMPLE/MEDIUM/COMPLEX/REASONING tier system, smart-router and
# reasoning-tier were removed on 2026-09-13 (one smart-router request in the
# ledger's whole history, none for reasoning-tier). Every alias is one model.
#
# install.sh copies this to config.yaml on a fresh install, and config.yaml is
# gitignored from then on. The live file is yours: the Models page writes to
# it every time you repin a role, and an upgrade must never overwrite what you
# chose. This file is a starting point that is known to work, not a set of
# recommendations -- the pins below are one deployment's answers on one day.
#
# What matters is the SHAPE, because the rest of the system depends on it:
#
#   * every alias the agent asks for is a `model_name` beginning `agent-`
#     (agent/model_config.py MANAGED_ROLES is the list, and a test asserts
#     every alias here is one of them);
#   * `model_info` carries the per-token rates the analytics page bills from
#     for models the proxy cannot report a cost for;
#   * `api_key: os.environ/OPENROUTER_API_KEY` -- no key is ever written here.
#
# Repin from the dashboard (Settings -> Models) rather than by hand: it writes
# this same file and keeps the rate table in step. The router reloads the
# file when it changes; nothing needs a restart either way.

model_list:
  # ── Fallback targets (all via OpenRouter) ─────────────────────────────────
  # Unnamed deployments that router_settings.fallbacks below sends roles to.
  # model_info rates are a fallback for the rate table when the ledger has no
  # billed cost; the dashboard reads live prices from OpenRouter's catalog.

  # A cheap, proven tool-caller: the demo's last resort.
  - model_name: gpt-4o-mini
    params:
      model: openrouter/openai/gpt-4o-mini
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      input_cost_per_token: 0.00000015
      output_cost_per_token: 0.0000006

  # Keeps the reviewer's fallback on a different vendor from the coder's, and
  # handles tools + a forced tool_choice (verified 2026-08-25).
  - model_name: claude-haiku-4.5
    params:
      model: openrouter/anthropic/claude-haiku-4.5
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000005

  # 2026-08-17: bare "deepseek-v4-pro" on OpenRouter is NOT a rolling alias —
  # it's pinned to the old 0423 snapshot. The GA release is a separate model
  # id, "-0813", which has to be named explicitly or you silently stay on
  # April's model forever.
  - model_name: deepseek-v4-pro
    params:
      model: openrouter/deepseek/deepseek-v4-pro-0813
      api_key: os.environ/OPENROUTER_API_KEY
      # Third-party resellers of open-weight models have generated malformed
      # tool-call ids and then rejected their own output; this one is skipped.
      extra_body: {"provider": {"ignore": ["Venice"]}}
    model_info:
      input_cost_per_token: 0.00000132
      output_cost_per_token: 0.00000396

  # ── Pinned per-role aliases ───────────────────────────────────────────────
  # One FIXED model per role -- no pools, no classifier -- so cost and
  # accuracy per model are directly attributable. The agent only ever names
  # the role alias. Repin from the Models page, or edit here; the router
  # picks the change up without a restart. model_info costs mirror
  # OpenRouter's pricing on the pin date -- BudgetGuard's fallback rate table
  # (agent/tools/model_rates.py) parses these same fields.
  - model_name: agent-summarizer
    params:
      # Pin on latency, not price. This role sits on the CRITICAL PATH of
      # every long conversation (SummarizationMiddleware runs before_model,
      # so nothing moves until it returns): the "cheapest tier is fine"
      # pin of 2026-08 ran at 11 tok/s and a single planning turn spent 635
      # of its first 700 seconds inside two summarizer calls. A cent per
      # summarization is nothing next to that.
      model: openrouter/openai/gpt-4.1-nano
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body: {"provider": {"require_parameters": true}}
    model_info:
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000004
  - model_name: agent-coder-frontend
    params:
      # The coder seat for frontend work (agent/frontend_route.py routes a
      # task here on category ui-styling, mostly-frontend paths, or the
      # operator's toggle). Pinned 2026-09-09 to kimi-k3 for frontend polish
      # -- operator's call; ~10x the general coder's price per call, which is
      # exactly why the route is gated. 431 tool-calling calls on this board
      # with zero failures as reasoning-tier. Falls back to the general coder
      # so a Kimi outage degrades to today's behaviour, not a dead task.
      model: openrouter/moonshotai/kimi-k3
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body: {"provider": {"require_parameters": true, "ignore": ["Venice"]}}
    model_info:
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
  - model_name: agent-coder-fallback
    params:
      # The seat a task moves to when the loop guard ends a pass
      # (agent/middleware/repeat_guard.py): the model on the regular seat
      # kept repeating one refused call, so the rest of that pass runs on a
      # different model. Pinned 2026-09-24 to qwen3.8-flash, operator's call.
      # Falls back to the general coder so an outage here never ends a task.
      model: openrouter/qwen/qwen3.8-flash
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body: {"provider": {"require_parameters": true}}
    model_info:
      input_cost_per_token: 0.00000015
      output_cost_per_token: 0.00000047
  - model_name: agent-investigator
    params:
      model: openrouter/z-ai/glm-5.3-flash
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body: {"provider": {"require_parameters": true}}
    model_info:
      input_cost_per_token: 1.5e-07
      output_cost_per_token: 5.0e-07
  - model_name: agent-coder
    params:
      # The main work loop -- file edits, shell, checks. Wants reliable tool
      # calling above all; the pin is one deployment's answer on one day.
      model: openrouter/deepseek/deepseek-v4.1-flash
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body: {"provider": {"require_parameters": true}}
    model_info:
      input_cost_per_token: 1.5e-07
      output_cost_per_token: 6.0e-07
  - model_name: agent-planner
    params:
      # Plans the task and digests reviewer feedback: lighter-weight than
      # code editing, so a cheap tool-capable model.
      model: openrouter/z-ai/glm-5.3-flash
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body: {"provider": {"require_parameters": true}}
    model_info:
      input_cost_per_token: 1.5e-07
      output_cost_per_token: 5.0e-07
  - model_name: agent-vision
    params:
      # Vision bridge for the coding agent's describe_image tool -- the
      # pinned planner/coder are text-only, so screenshots/photos attached
      # to tasks get described through this (2026-08-21).
      model: openrouter/qwen/qwen3-vl-235b-a22b-instruct
      api_key: os.environ/OPENROUTER_API_KEY
      # Server-side output cap. The client sends NO cap on purpose -- see
      # agent/tools/vision.py: langchain emits max_completion_tokens, which
      # no provider of this model supports, and require_parameters turned
      # that into a 404 on every vision call.
      max_tokens: 1500
      extra_body: {"provider": {"require_parameters": true}}
    model_info:
      input_cost_per_token: 0.00000021
      output_cost_per_token: 0.0000019
  - model_name: agent-test-writer
    params:
      model: openrouter/z-ai/glm-5.3-flash
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body: {"provider": {"require_parameters": true}}
    model_info:
      input_cost_per_token: 7.5e-08
      output_cost_per_token: 2.5e-07
  - model_name: agent-verifier
    params:
      # The verifier tries to break a bug fix before it ships. Its own alias
      # (2026-09-25) so its calls are billed as its own, not the test-writer's.
      model: openrouter/z-ai/glm-5.3-flash
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body: {"provider": {"require_parameters": true}}
    model_info:
      input_cost_per_token: 7.5e-08
      output_cost_per_token: 2.5e-07
  - model_name: agent-reviewer
    params:
      # The commit reviewer (services/commit-reviewer/reviewer.js), routed
      # here since 2026-08-25 so it is pickable on the Models page and its
      # spend is in the ledger. A dedicated pin: the reviewer's independence
      # from the agent is the point of the gate, so it must not share the
      # coder's model.
      #
      # What this role needs, in order: instruction-following and judgement
      # (its failure mode is FALSE POSITIVES — a wrong blocking finding costs a
      # full fix-and-review round), long context (diff + commit log + gathered
      # test/reference files), then reliable tool calling for the single
      # submit_review call. It never writes or runs code — the mechanical checks
      # execute in Node before the model is called — so a coding-tuned model is
      # the wrong instinct here.
      model: openrouter/anthropic/claude-sonnet-5
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body: {"provider": {"require_parameters": true, "only": ["Anthropic"], "allow_fallbacks": false}}
      # [managed] family extras for an Anthropic pin -- auto-added by the
      # dashboard editor; auto-removed when this role is repinned off
      # Anthropic. Do not hand-edit: see _normalize_family_extras.
      additional_drop_params: ["temperature", "top_p", "top_k"]
      cache_control_injection_points:
        - location: message
          role: system
        - location: message
          index: -1
    model_info:
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.00001

  - model_name: agent-cartographer
    params:
      # The codebase-map builder (agent/cartographer.py). Runs on a schedule,
      # once per repo, and only when the repo's file inventory has actually
      # changed -- so this is a rare call, not a per-task one.
      #
      # It never reads files or calls tools: the inventory is gathered
      # deterministically in Python first and handed over as one prompt. What it
      # needs is long-context comprehension, summarisation and strict
      # instruction-following -- not tool reliability, coding skill or reasoning
      # depth. An instruct model is the right CATEGORY here; reasoning tokens
      # would be spent on a task with nothing to reason about.
      #
      # Judge a candidate by grading every path it cites against the
      # filesystem (2026-08-26, four candidates on a 599-file inventory): the
      # failure mode that matters for a MAP is confident invention -- two
      # candidates inferred a source file from the name of its test -- and
      # more output was not better. Bare filenames are the other tell.
      model: openrouter/~z-ai/glm-flash-latest
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body: {"provider": {"require_parameters": true}}
    model_info:
      # Fallback only -- the dashboard now reads price from the live OpenRouter
      # catalog (get_current_pins_priced), because these hand-written blocks
      # drift. Kept so a catalog outage degrades to a stale number, not to "—".
      input_cost_per_token: 0.000000075
      output_cost_per_token: 0.00000025

  - model_name: agent-consolidator
    params:
      # The nightly memory-consolidation job (agent/consolidation.py): once
      # per project per night, so quality over cost.
      #
      # The one constrained role: it sends tools and response_format together,
      # and structured output is a FORCED tool call. Every provider of the
      # qwen*-max family rejects tool_choice=required/object in thinking mode,
      # which silently killed consolidation for any project with episodes
      # (projects with nothing to do short-circuit before the tool call and
      # "passed"). Probed against the real call shape on 2026-08-25:
      #   qwen3.8-max FAIL   qwen3.7-max FAIL
      #   gemini-3.1-pro-preview OK   deepseek-v4-pro OK   claude-haiku-4.5 OK
      # Change this pin only against a probe (agent/model_config.py).
      model: openrouter/google/gemini-3.1-pro-preview
      api_key: os.environ/OPENROUTER_API_KEY
      # Provider guard (2026-08-25): OpenRouter fans a model out across several
      # upstream providers and they do NOT all support the same request
      # parameters. require_parameters=true routes only to providers that support
      # every parameter in the request. Per-request, so a call with tools and
      # reasoning is constrained while a plain completion is not -- no static
      # provider allow-list to maintain as providers change. This is what turned
      # a silent 400 into an honest 404 and made the real problem visible.
      extra_body: {"provider": {"require_parameters": true}}
    model_info:
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.000012

  - model_name: agent-classifier
    params:
      # Dedicated pin (2026-08-23): a single cheap, non-agentic call per task
      # creation (agent/classify.py) that sorts the goal into a fixed
      # taxonomy for the Analytics dashboard's cost/count-by-category
      # breakdown. Never read by the coordinator -- accuracy matters less
      # here than for any real task-execution role. nova-micro-v1 was tried
      # first (cheapest option) but showed real, repeated request timeouts
      # in live testing; gpt-4o-mini is already trusted elsewhere in this
      # config for reliable, fast completions on simple classification-style
      # calls, and is still inexpensive.
      model: openrouter/openai/gpt-4o-mini
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body: {"provider": {"require_parameters": true}}
    model_info:
      input_cost_per_token: 0.00000015
      output_cost_per_token: 0.0000006
  - model_name: agent-planning-chat
    params:
      # The Planning tab's chat agent (agent/planning_chat.py): web search,
      # browsing, read-only repo access, drafting a plan for a build task to
      # pick up. The EASY half of a pair: planning_chat.py classifies each
      # message per turn (keyword floor, then an agent-classifier call) and
      # picks this alias for research and simple design turns, escalating to
      # agent-planning-chat-hard for a turn that reads as debugging or a
      # genuinely hard problem. Called with reasoning_effort="high".
      # DeepSeek: cheap per token, and the provider does automatic prefix
      # caching, so the high-volume EASY tier's re-sent context bills at the
      # cache-read rate with no cache_control plumbing.
      model: openrouter/z-ai/glm-5.3-flash
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body: {"provider": {"require_parameters": true}}
    model_info:
      input_cost_per_token: 1.5e-07
      output_cost_per_token: 5.0e-07
  - model_name: agent-planning-chat-hard
    params:
      # HARD half of the planning-chat pair -- see agent-planning-chat above.
      # The Anthropic-only extras (additional_drop_params, cache_control
      # injection points) are added and removed by the dashboard editor as
      # the pin moves on and off Anthropic -- see agent-reviewer below.
      model: openrouter/z-ai/glm-5.3-flash
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body: {"provider": {"require_parameters": true}}
    model_info:
      input_cost_per_token: 1.5e-07
      output_cost_per_token: 5.0e-07
  - model_name: agent-planning-chat-frontend
    params:
      # Planning chat for frontend sessions (agent/frontend_route.py), ahead
      # of the EASY/HARD ladder. Same model as the frontend coder so the plan
      # is written in the vocabulary that will build it. Operator's call,
      # 2026-09-09. Falls back to the hard tier.
      model: openrouter/moonshotai/kimi-k3
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body: {"provider": {"require_parameters": true, "ignore": ["Venice"]}}
    model_info:
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
  - model_name: agent-demo-chat
    params:
      # Optional public demo bot -- an unauthenticated, resume-style chat
      # endpoint with web search/browse but NO repo, database or memory
      # access of any kind. Unused unless a deployment runs one.
      #
      # This endpoint is unauthenticated, so its traffic is whatever the
      # internet decides to send it, and the model must stay cheap; the demo
      # server's own rate limits bound the downside. Do not repoint this at
      # a premium model. The rates below are one provider's: no provider is
      # pinned, so OpenRouter routes around a throttled or dead one (two
      # 429s a minute apart on a single pinned provider took the whole demo
      # down on 2026-08-31), and the spend figure is approximate by design.
      model: openrouter/~deepseek/deepseek-v4-flash-latest
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body: {"provider": {"require_parameters": true}}
    model_info:
      input_cost_per_token: 0.00000005
      output_cost_per_token: 0.00000016

  # Episode recall's embedding model (agent/embeddings.py). Deliberately NOT
  # an `agent-` name: every agent-* alias has to be a MANAGED_ROLE, which
  # tests/test_managed_roles_complete.py enforces, and managed roles are what
  # the dashboard's Models page offers as chat seats. An embedding model in
  # that picker is a pin an operator can only get wrong. It is named after
  # the consumer that asks for it, which is how this router's other non-seat
  # aliases are named.
  #
  # Swapping the model is this entry and nothing else, like every other role.
  # `dimensions` is what keeps that swap safe: openai/text-embedding-3-large
  # answers 3072 by default, and the store's vector column was created at the
  # width below -- agent/embeddings.py refuses a width it did not ask for
  # rather than writing a vector the index cannot use.
  #
  # No output_cost_per_token on purpose: an embedding has no completions, and
  # a 0 there would read to the rate table as a rate rather than as "does not
  # apply". Spend for this alias comes from the ledger's billed usage.cost
  # like everything else.
  - model_name: embedder
    params:
      model: openrouter/openai/text-embedding-3-small
      api_key: os.environ/OPENROUTER_API_KEY
      # 30s: a task has already spent minutes by the time its episode is
      # written, and an embedding that hangs should fail and be picked up by
      # the backfill rather than hold a finished task open.
      timeout: 30
      extra_body: {"dimensions": 1536}
    model_info:
      input_cost_per_token: 0.00000002

  # Web search for the planning agent, the coder's research tools and any
  # other caller of agent/tools/web_search.py. OpenRouter's web plugin runs
  # the search and returns cited results; the model here only has to answer
  # with the list, so the cheapest reliable one is enough. Scraping Bing from
  # a datacenter address returned empty pages (2026-09-30), which is why this
  # exists. Not an agent-* name: it is not a chat seat.
  - model_name: web-search
    params:
      model: openrouter/openai/gpt-4.1-nano
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 45
    model_info:
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000004

router_settings:
  # Which OpenRouter providers may serve a call: "zdr" (only hosts that keep
  # nothing; the default), "deny" (only hosts that neither store nor train on
  # it) or "off" (whatever your OpenRouter account allows). Also set from the
  # dashboard's Models page; applied on the next call, no restart.
  privacy: "zdr"
  # Tried in order when the pinned model refuses (a permanent failure, or a
  # transient one past the retry budget) -- see router/app.py. Each target
  # must itself be a model_name above, or it is dropped.
  fallbacks:
    # Both verified on 2026-08-25 to handle tools + a forced tool_choice, so
    # this is a real second chance rather than a different route to the same
    # wall.
    - agent-consolidator: ["deepseek-v4-pro", "claude-haiku-4.5"]
    # The cartographer is one long-context summarisation call with no tools,
    # so any capable model can stand in. mistral-small's two OpenRouter
    # providers were both 429 ("upstream_provider_shared_pool") at 23:5x on
    # 2026-09-08 with "Available Model Group Fallbacks=None" -- the map just
    # went unbuilt. deepseek-v4-pro is already the fallback for three other
    # roles and handles 5k-token inventories trivially.
    - agent-cartographer: ["deepseek-v4-pro"]
    # agent-summarizer runs before_model on every long conversation, so a
    # provider hiccup there stalls the turn outright rather than degrading
    # it. deepseek-v4-pro: the board's proven escape hatch.
    - agent-summarizer: ["deepseek-v4-pro"]
    # Planning chat fails over to its own HARD sibling (2026-08-26, after an
    # upstream 429 on a shared pool killed a planning turn outright). The
    # hard model is a strict superset of what the easy role needs: same
    # tools, same prompt shape, already pinned. Worst case a cheap turn runs
    # on the expensive model for one reply.
    - agent-planning-chat: ["agent-planning-chat-hard"]
    # And the hard model's own escape hatch, in case ITS provider pool chokes:
    # deepseek-v4-pro is the proven tool-caller on this board (0 failures in
    # 3,261 calls as the coder).
    - agent-planning-chat-hard: ["deepseek-v4-pro"]
    # Frontend tiers (2026-09-09) fall back to the general seats they replace.
    - agent-planning-chat-frontend: ["agent-planning-chat-hard"]
    - agent-coder-frontend: ["agent-coder"]
    - agent-coder-fallback: ["agent-coder"]
    # agent-planner coordinates every task's work pass, so a provider hiccup
    # there kills a pass mid-task. Same remedy: the proven tool-caller.
    - agent-planner: ["deepseek-v4-pro"]
    # The demo's last resort, reached only when the MODEL is unavailable on
    # every provider. gpt-4o-mini rather than deepseek-v4-pro: the endpoint
    # is unauthenticated, so the fallback has to stay cheap too, and mini is
    # a proven tool-caller, which the demo needs for web search/browse.
    - agent-demo-chat: ["gpt-4o-mini"]
    # audit H-8: the review call had no router fallback, so a stall or a 429 on
    # the reviewer's provider pool blocked the review outright. Since C-3 makes a
    # failed review fail CLOSED (NEEDS_FIXES), that would block every merge on a
    # provider hiccup. claude-haiku-4.5 keeps the reviewer independent from the
    # coder (a different model than deepseek-v4-pro); deepseek-v4-pro is the
    # cross-vendor escape hatch and the proven tool-caller for the structured
    # submit_review call. Complements reviewer.js's own HTTP retry/timeout.
    - agent-reviewer: ["claude-haiku-4.5", "deepseek-v4-pro"]

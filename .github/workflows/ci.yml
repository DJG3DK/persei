name: CI

# The review's own verdict: no CI at all, despite a green suite, a clean
# frontend build and a passing Node test — "the single highest-leverage
# addition". It would have caught two of the findings it reported: pytest
# failing to collect on a clean checkout (H4), and a script that died with
# ModuleNotFoundError on every invocation (H5).
#
# Everything here runs offline: no model calls, no network, no secrets --
# CI that needs secrets is CI that contributors cannot run.
#
# The one service is a throwaway Postgres for the python job, and it is
# there for exactly one suite: tests/test_sqlite_store_parity.py compares
# the two backends, and without a DSN its Postgres half skipped everywhere
# -- so "parity" was asserted against one backend only, which is the thing
# it exists to rule out. The suite creates its tables in a scratch schema it
# drops afterwards, so this costs a container and nothing else.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request supersedes the run in flight. Not
# on main: cancelling there left commits with no finished run, and the
# release gate needs a green run for the exact commit it tags.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python — tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # 16 because that is what the deployment runs; a parity comparison
        # against a different major version would prove the wrong thing.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: parity
          POSTGRES_DB: parity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # The local (SQLite) backend's dependencies, which the SERVER does
          # not install -- they are here because the parity suite skips
          # itself when they are absent, and a suite that only ever runs on
          # one developer's machine is not a gate. They need no system
          # package, which is the whole reason that is affordable.
          pip install -r requirements-cli.txt
          # The planner's repo search (agent/tools/planning_tools.py) shells
          # out to ripgrep; its tests run the real binary.
          sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
          # tests/test_review_services_gated.py starts the review dashboard
          # for real, and it needs express. Without this it would skip -- see
          # REQUIRE_SERVICE_TESTS on the pytest step, which makes that a failure.
          npm ci --prefix services/agent-review --omit=dev --no-audit --no-fund

      - name: Lint (ruff)
        # ruff config landed with the source's ~65 existing noqa codes, which
        # had never been enforced by anything. The ruleset is what the code
        # already satisfies; deferred rules are listed in ruff.toml. The
        # version is the one requirements.txt pins, installed above; an
        # unpinned `pip install ruff` here could lint with a newer one than
        # a contributor's.
        run: ruff --version && ruff check .

      # No .env is created on purpose. conftest.py supplies placeholder values
      # via setdefault, so this run also proves a fresh clone can run the suite
      # — the exact thing that was broken (H4).
      - name: pytest (no .env — a fresh-clone run)
        run: python -m pytest -q
        env:
          # The parity suite's reference leg. Only that suite reads it, and
          # it isolates itself in a per-run scratch schema -- see the file's
          # docstring. Every other test stays offline.
          AGENT_TEST_PG_DSN: postgresql://postgres:parity@localhost:5432/parity
          # The review-service gate test starts real services; on a laptop
          # without their npm dependencies it skips, here it must run.
          REQUIRE_SERVICE_TESTS: "1"

      # The model router is its own service with its own venv in production,
      # so its tests run against its own pinned requirements, in a venv of
      # their own. They used to run against the root requirements, which
      # proved the router works with whatever the agent happens to install
      # rather than with what its image installs.
      - name: pytest (model router, its own requirements)
        run: |
          python -m venv services/model-router/.venv
          services/model-router/.venv/bin/pip install -q -r services/model-router/requirements.txt pytest==9.1.1 pytest-asyncio==1.4.0
          services/model-router/.venv/bin/python -m pytest -q services/model-router/tests

      # services/ is excluded from the repo-wide ruff run because it is mostly
      # Node. The model router is Python we own, so it gets linted explicitly
      # rather than by widening the global scope.
      - name: ruff (model router)
        run: ruff check services/model-router

      # The detection rules in agent/provisioning.py propose commands that
      # OTHER machines execute, so the script that runs them for real is
      # worth keeping alive even where its toolchains are absent. --no-docker
      # exercises detection end to end plus the Make and pytest stacks,
      # including the property that a broken assertion actually fails the
      # check. The Go/Rust/Ruby half needs three image pulls and runs from
      # the manual "Stack checks" job below.
      - name: Proposed checks still run (host stacks)
        run: python3 scripts/verify_stack_checks.py --no-docker

      - name: Scripts import cleanly
        # H5: probe_forced_tool_call.py was the only script missing the
        # sys.path prelude and died with ModuleNotFoundError every time,
        # including from the dashboard button. Compiling every script catches
        # syntax errors; importing the module body catches the missing path.
        run: |
          python -m compileall -q scripts/ agent/
          for f in scripts/*.py; do
            python - "$f" <<'PY'
          import ast, sys
          src = open(sys.argv[1]).read()
          tree = ast.parse(src)
          # a script that touches `agent.` must set sys.path first
          uses_agent = any(
              isinstance(n, (ast.Import, ast.ImportFrom))
              and any(getattr(a, "name", "") == "agent" or (getattr(n, "module", "") or "").startswith("agent")
                      for a in (n.names if isinstance(n, ast.Import) else [n]))
              for n in ast.walk(tree)
          )
          if uses_agent and "sys.path.insert" not in src:
              raise SystemExit(f"{sys.argv[1]}: imports agent.* without the sys.path prelude")
          PY
          done

  frontend:
    name: Frontend — typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run lint
      # Before the build: a failing test should stop the run at the cheapest
      # point that can explain why, and a build that succeeds on broken
      # behaviour is not evidence of anything.
      - run: npm test
      - run: npm run build

  site:
    name: Landing page — typecheck, lint, test, build
    # perseiagent.ai's public page, built separately from the console and not
    # shipped with an installation (scripts/package_release.sh drops it). Its
    # build asserts the page ends up with no JavaScript at all, so a change
    # that reintroduced a runtime would fail here rather than quietly ship one.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: The page ships no JavaScript
        run: |
          if grep -q '<script[^>]*src=' dist/index.html; then
            echo "dist/index.html references a script; this page must be static" >&2
            exit 1
          fi
          test -s dist/index.html

      # The newsletter signup behind the page's form. Its own venv, because it
      # is the landing page's service and not the agent's -- neither ships
      # with an installation.
      - name: Newsletter signup
        working-directory: site/server
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -r requirements.txt
          .venv/bin/python -m pytest -q test_newsletter.py

  services:
    name: Node services — syntax and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Syntax-check every service file
        # These have no dependencies and no build step, so `node --check` is
        # the whole story — and it is what would have caught the temporal
        # dead zone that crash-looped the reviewer on boot.
        run: |
          for f in services/*/*.js services/shared/*.js; do
            [ -e "$f" ] || continue
            node --check "$f"
          done

      - name: Shared project-config tests
        run: |
          node tests/test_projects_config_merge.js
          node tests/test_reviewer_preexisting.js
          node tests/test_reviewer_gate_attribution.js
          node tests/test_review_state_lock.js
          node tests/test_review_services_git_hooks.js
          node tests/test_reviewer_rebuttal.js
          node tests/test_stale_build_steps.js
          # The Windows installer's pure decisions. pwsh ships on the
          # GitHub ubuntu runners, so this needs no setup step.
          pwsh tests/test_install_ps1.ps1
          node tests/test_reviewer_candidates.js
          # Where agent-authored code is allowed to run (SECURITY.md).
          node tests/test_reviewer_sandbox.js
          node tests/test_reviewer_sandbox_modes.js
          node tests/test_preflight.js
          node tests/test_service_env.js
          node tests/test_health_projects.js
          node tests/test_reviewer_projects_reload.js
          node tests/test_bare_project_entry.js
          node tests/test_sw_push.js

      - name: Reviewer dependency mounts (as root — the read-only proof)
        # This one needs real bind mounts: it borrows a directory the way the
        # reviewer does, writes through it, and requires EROFS. Without root
        # those cases skip, and a suite that silently skips its only proof of
        # the read-only guarantee proves nothing -- which is what was
        # happening here. REQUIRE_MOUNT_TESTS=1 turns a skip into a failure,
        # and the runner has passwordless sudo, so CI actually exercises the
        # mechanism the reviewer uses in production.
        run: sudo REQUIRE_MOUNT_TESTS=1 node tests/test_reviewer_dependency_dirs.js

  stacks:
    name: Stack checks — real toolchains (manual)
    # Pulls an image per stack (Go, Rust, Ruby, Elixir, Maven, Gradle,
    # Composer and the .NET SDK), so it is not worth running on every push.
    # Run it from the Actions tab after changing detection in
    # agent/provisioning.py -- it is what caught the rust image shipping
    # without rustfmt or clippy.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python3 scripts/verify_stack_checks.py

  bundle-paths:
    name: Bundle — did this push touch it?
    # The two docker jobs below build images and run containers, which is
    # too slow for every push and too important to leave to the Actions tab:
    # while `bundle` was manual-only, three bundle regressions in a row
    # reached main (a network name that broke under the legacy project name,
    # a router URL without /v1, a backup script with no bundle path). They
    # run on a push to main that touches what the bundle is built from, and
    # on demand.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # A push whose starting point is unknown (a new branch, a force
          # push) runs the jobs rather than guessing.
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --quiet "$BEFORE" HEAD -- docker docker-compose.yml agent services requirements.txt .github/workflows/ci.yml; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "nothing the bundle is built from changed"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  bundle:
    name: Bundle — the stack actually starts
    # Builds five images and runs them. On a push to main that touches what
    # the bundle is built from (bundle-paths above), or from the Actions tab.
    #
    # This is the half `docker compose config` cannot see. Both bundle
    # regressions it exists to catch were found by hand: a healthcheck whose
    # image has no curl, and a secret file the reviewers read before the
    # agent's entrypoint writes it. Neither is a YAML error, and both make
    # `up` hang rather than fail -- which is why every wait here has a
    # timeout and dumps logs on the way out.
    needs: bundle-paths
    if: needs.bundle-paths.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: An .env with no real credentials
        # The stack must come up without reaching an upstream. The router's
        # LIVENESS probe -- the one compose waits on -- answers without a
        # key; only readiness talks to OpenRouter, and nothing here waits on
        # readiness. A placeholder key proves that stays true.
        run: |
          cp docker/.env.example .env
          sed -i "s|^OPENROUTER_API_KEY=.*|OPENROUTER_API_KEY=placeholder-not-a-real-key|" .env
          sed -i "s|^PROJECTS_DIR=.*|PROJECTS_DIR=${{ github.workspace }}/.ci-projects|" .env
          mkdir -p .ci-projects

      - name: Bring the stack up and wait for healthy
        # --wait honours the depends_on/service_healthy graph, so this fails
        # if any healthcheck never goes green instead of racing past it.
        run: docker compose up -d --wait --wait-timeout 600

      - name: The console answers
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8100/api/health || true)
            [ "$code" = "200" ] && echo "agent healthy after ${i}0s" && exit 0
            sleep 10
          done
          echo "agent never answered 200 on /api/health"
          exit 1

      - name: Every service is still running
        # up --wait returns when healthchecks pass; a service that crashed
        # immediately afterwards (a missing env var read at first use rather
        # than at boot) still looks like success without this.
        #
        # A one-shot (restart: "no" -- the sandbox-image build) is meant to
        # have exited, and must have exited 0. Comparing every declared
        # service against the running ones counted it as a crash, so this
        # step failed on every run and the job could never pass.
        run: |
          docker compose ps --all
          docker compose config --format json > /tmp/config.json
          jq -r '.services | to_entries[] | select(.value.restart != "no") | .key' /tmp/config.json | sort > /tmp/declared
          docker compose ps --status running --format '{{.Service}}' | sort > /tmp/running
          diff /tmp/declared /tmp/running
          for svc in $(jq -r '.services | to_entries[] | select(.value.restart == "no") | .key' /tmp/config.json); do
            state=$(docker compose ps --all --format '{{.Service}} {{.State}} {{.ExitCode}}' | awk -v s="$svc" '$1 == s {print $2, $3}')
            echo "$svc: ${state:-not found}"
            [ "$state" = "exited 0" ] || { echo "one-shot $svc did not exit 0" >&2; exit 1; }
          done

      - name: Logs, on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Down
        if: always()
        run: docker compose down -v

  sandbox:
    name: Sandbox — the docker-backed suites
    # tests/test_review_db_check_e2e.py and tests/test_sandbox_gh.py need
    # the sandbox image and a daemon, and skip without them -- which, with
    # nothing here building the image, they always did. They run against a
    # freshly built image on the same pushes as the bundle job, and a skip
    # here is a failure: the image is built two steps up, so a skipped suite
    # means the guard is wrong, not the machine.
    needs: bundle-paths
    if: needs.bundle-paths.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: pip install -r requirements.txt
      - name: Build the sandbox image
        run: docker build -t tektonix-sandbox:latest docker/agent-sandbox
      - name: The docker-backed suites, none skipped
        run: |
          python -m pytest -q -rs tests/test_review_db_check_e2e.py tests/test_sandbox_gh.py 2>&1 | tee /tmp/pytest.out
          if grep -q -i 'skipped' /tmp/pytest.out; then
            echo "a docker-backed suite skipped although the image was just built" >&2; exit 1
          fi

  app:
    name: Desktop app — fmt, clippy, tests
    # The Rust backend of the desktop app (app/src-tauri) and the panel's
    # JavaScript. Until 2026-09-29 nothing here checked either: every Rust
    # change was checked by hand in this same container, and a broken one
    # would first fail inside the release build, fifteen minutes in. The
    # cfg!(windows) branches are type-checked by app-windows below; a
    # Windows target cannot be checked from Linux (ring's build script
    # wants a Windows C toolchain). No installer is built in CI; the tag
    # build does that.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container: ivangabriele/tauri:debian-bookworm-20
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cargo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            /usr/local/cargo/registry
            app/src-tauri/target
          key: app-cargo-${{ runner.os }}-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: app-cargo-${{ runner.os }}-
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Panel JavaScript parses
        working-directory: app
        run: node --check src/main.js

  app-windows:
    name: Desktop app — Windows type-check
    # `cargo check` on a Windows runner: the cfg!(windows) branches compile
    # and the dependency tree resolves for the target the installer is built
    # for, in minutes rather than the release build's quarter hour. No
    # bundling, no installer.
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cargo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            app/src-tauri/target
          key: app-cargo-windows-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: app-cargo-windows-
      - run: cargo check

  shell:
    name: Shell — installer and cron scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The dry-run exercises install.sh's own prerequisite checks, which
      # include a Node floor. Without pinning the version here the job tests
      # whatever Node the runner image happens to ship -- which is how raising
      # that floor to 24 broke this job while the code was correct.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: bash -n every script
        run: |
          for f in install.sh scripts/*.sh; do
            [ -e "$f" ] || continue
            bash -n "$f"
          done
          # The one-line Linux installer runs under plain sh (curl ... | sh).
          sh -n site/public/install-linux.sh
      - name: The installer never installs anything unasked
        # Sources install.sh as a library, so nothing is installed and no
        # package manager is needed.
        run: bash tests/test_install_prereqs.sh
      - name: Deploy poller
        run: bash tests/test_deploy_poll.sh
      - name: Bundle entrypoints
        # The three containers' first-run, upgrade and PUID decisions, with
        # the privileged tools stubbed.
        run: bash tests/test_bundle_entrypoints.sh
      - name: Backup script
        run: bash tests/test_backup_bundle.sh
      - name: Cron wrappers on a fresh tree
        run: bash tests/test_cron_wrappers.sh
      - name: Doctor runs on a tree with no configuration
        # It must report what is missing rather than crash -- that is exactly
        # the state a new contributor's checkout is in. Exit 1 (something
        # FAILED) is the expected answer on an unconfigured tree; a traceback
        # or any other exit code is not.
        #
        # This used to be `| grep -qv Traceback`, which passes when ANY line
        # lacks the word -- true of every traceback ever printed. The step
        # could not fail.
        run: |
          rc=0
          python3 scripts/doctor.py --quiet > /tmp/doctor.out 2>&1 || rc=$?
          cat /tmp/doctor.out
          if grep -q 'Traceback' /tmp/doctor.out; then
            echo "doctor crashed on an unconfigured tree" >&2; exit 1
          fi
          case "$rc" in
            0|1) ;;
            *) echo "doctor exited $rc; 0 or 1 expected" >&2; exit 1 ;;
          esac

      - name: Installer dry-run reaches the end
        # Exercises argument parsing, the prerequisite checks and the step
        # ordering without writing anything.
        run: ./install.sh --dry-run --yes
        env:
          PG_DSN: postgresql://placeholder@localhost:5432/placeholder
          OPENROUTER_API_KEY: placeholder

      - name: Compose file interpolates
        # Does not start the stack -- that needs image builds. It does fail
        # if a ${VAR:?} is missing, a service name is mistyped in
        # depends_on, or the YAML no longer parses. The full `up --wait` is
        # the `bundle` job above, run from the Actions tab; this is the
        # offline half every push can afford.
        run: docker compose config --quiet
        env:
          PROJECTS_DIR: /tmp
          OPENROUTER_API_KEY: placeholder

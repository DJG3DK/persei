name: Release

# On a version tag: publish the bundle's images to GHCR, so an install that
# cannot build from source (the desktop app, a machine without the tree)
# pulls the release instead. Each image is pushed as :vX.Y.Z only; nothing
# consumes a moving :latest, so none is pushed. The digest each image was
# pushed as goes into digests.json on the GitHub release, signed with the
# updater's key, and the desktop app pulls by those digests (stack.rs pull),
# so a retagged image on the registry is not what an install gets.
# The desktop app tags the pulled image with the local name compose uses
# (tektonix-<service>:latest) and starts the stack with --no-build.
#
# Every action here is pinned to a commit, with the release it is in the
# comment beside it; Dependabot's github-actions entry moves the pins.
# This workflow holds the updater's signing key, and auto-update is on by
# default in the app: whoever could move a tag like `v7` on an action used
# here could sign an update for every desktop install. A commit cannot be
# moved. The signing secrets belong in a `release` Environment with a
# required reviewer (Settings -> Environments), and the `v*` tags behind a
# ruleset; the job below names the environment so that protection applies
# once it exists.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish images for (must exist)"
        required: true

permissions:
  contents: read

jobs:
  gate:
    name: Gate — a version tag, on main, with a green CI run
    # Any `v*` tag used to build and push images and :latest, and a
    # dispatched tag input went straight into `sed` on Cargo.toml. The tag
    # has to name a semantic version, its commit has to be on main, and CI
    # has to have passed on that commit. A tag pushed the moment main was
    # updated may find CI still running: dispatch the workflow again once
    # it is green.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - name: The tag names a version, sits on main, and CI passed on its commit
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${TAG#v}"
          if [ "$v" = "$TAG" ] || ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "not a version tag (vX.Y.Z or vX.Y.Z-rcN): $TAG" >&2; exit 1
          fi
          sha=$(git rev-parse "refs/tags/$TAG^{commit}")
          git fetch -q origin main
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "$TAG ($sha) is not on main" >&2; exit 1
          fi
          green=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&status=completed&per_page=10" \
                    --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
          if [ "${green:-0}" -lt 1 ]; then
            echo "no successful CI run for $sha; wait for CI on main, then dispatch this workflow with tag=$TAG" >&2; exit 1
          fi
          echo "$TAG = $sha, on main, CI green"

  # A tag whose release is already published (a release made by hand, or a
  # draft published under a new tag name) is done: this repository's
  # published releases are immutable, so an upload to one fails anyway, and
  # a rebuild would repush its images under it.
  check:
    name: Is the release already published?
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.existing.outputs.published }}
    steps:
      - id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null | grep -q false; then
            echo "published=true" >> "$GITHUB_OUTPUT"; echo "release $TAG is already published; nothing to build"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  images:
    name: Images — ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: [gate, check]
    if: needs.check.outputs.published != 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: agent
            dockerfile: docker/agent/Dockerfile
            context: .
          - image: router
            dockerfile: docker/router/Dockerfile
            context: .
          - image: reviewer
            dockerfile: docker/reviewer/Dockerfile
            context: .
          - image: sandbox
            dockerfile: docker/agent-sandbox/Dockerfile
            context: docker/agent-sandbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "tag=${TAG#refs/tags/}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ github.event.inputs.tag || github.ref }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # amd64 only for now: the agent image builds the dashboard under
          # emulation for arm64 and that is an hour a release. Apple Silicon
          # runs amd64 images under Rosetta in Docker Desktop meanwhile.
          platforms: linux/amd64
          push: true
          tags: ghcr.io/djg3dk/tektonix-${{ matrix.image }}:${{ steps.version.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
      # Matrix jobs cannot hand a value each to the next job; a file each can.
      - name: Record the digest
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          printf '%s %s\n' "$IMAGE" "$DIGEST" > "digests/$IMAGE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image }}
          path: digests/${{ matrix.image }}
          if-no-files-found: error

  app-windows:
    name: Desktop app — Windows installer
    runs-on: windows-latest
    needs: [check, images]
    if: needs.check.outputs.published != 'true'
    # The signing key is read here and nowhere else. Protect this
    # environment with a required reviewer and the secrets are handed out
    # only after a person has looked at the run.
    environment: release
    permissions:
      contents: write
    outputs:
      signed: ${{ steps.codesign.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/src-tauri
      - run: npm ci
        working-directory: app
      # The installer, the updater manifest and the app's own version carry
      # the tag: Persei_0.9.0-rc13_x64-setup.exe, not a file named 0.9.0
      # for every candidate. Build-time only; nothing is committed. The tag
      # was checked against vX.Y.Z[-suffix] by the gate job, so what goes
      # into the sed is a version and nothing else.
      - name: Version the app after the tag
        shell: bash
        working-directory: app
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          v="${TAG#v}"
          node -e 'const fs=require("fs");for (const f of ["src-tauri/tauri.conf.json","package.json"]){const j=JSON.parse(fs.readFileSync(f,"utf8"));j.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(j,null,2)+"\n")}' "$v"
          sed -i "0,/^version = \".*\"/s//version = \"$v\"/" src-tauri/Cargo.toml
          echo "app version $v"
      # Windows code signing (Authenticode) through Azure Artifact Signing,
      # so Windows names the publisher instead of "Unknown publisher". On
      # when the three AZURE_* secrets and the three ARTIFACT_SIGNING_*
      # variables are set; Tauri then signs the app and the installer while
      # it builds them, before the updater signature is taken over the
      # installer's final bytes. Signing after the build would change the
      # bytes and break every app's update check.
      - name: Code signing, when configured
        id: codesign
        shell: bash
        working-directory: app
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          SIGN_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          SIGN_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          SIGN_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          if [ -z "$AZURE_CLIENT_ID" ] || [ -z "$SIGN_ENDPOINT" ] || [ -z "$SIGN_ACCOUNT" ] || [ -z "$SIGN_PROFILE" ]; then
            echo "::warning::code signing is not configured; the installer will be unsigned"
            echo "enabled=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          for v in "$SIGN_ENDPOINT" "$SIGN_ACCOUNT" "$SIGN_PROFILE"; do
            printf '%s' "$v" | grep -Eq '^[A-Za-z0-9:/._-]+$' || { echo "a signing variable holds unexpected characters" >&2; exit 1; }
          done
          cargo install trusted-signing-cli --locked
          # shellcheck disable=SC2016 # a JavaScript template literal, expanded by node
          node -e 'const fs=require("fs");const f="src-tauri/tauri.conf.json";const j=JSON.parse(fs.readFileSync(f,"utf8"));j.bundle=j.bundle||{};j.bundle.windows=j.bundle.windows||{};j.bundle.windows.signCommand=`trusted-signing-cli -e ${process.argv[1]} -a ${process.argv[2]} -c ${process.argv[3]} -d Persei %1`;fs.writeFileSync(f,JSON.stringify(j,null,2)+"\n")' "$SIGN_ENDPOINT" "$SIGN_ACCOUNT" "$SIGN_PROFILE"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      # Builds the NSIS installer, signs the updater artifact with the key in
      # the secrets, and attaches the installer, its .sig and latest.json to
      # the GitHub release for this tag (creating the release if the tag has
      # none yet). The app's own updater reads latest.json from this tag's
      # own release (releases/download/<tag>/latest.json; stack.rs
      # updater_endpoint), so a candidate can update to the next candidate.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Read by trusted-signing-cli when code signing is configured.
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          # Baked into the binary (stack.rs release_tag): the app pulls the
          # images of the release it came from, rc or not.
          TEKTONIX_RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        with:
          projectPath: app
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Persei ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: "See CHANGELOG.md."
          # A draft: this repository has immutable releases, and a published
          # release accepts no assets. The publish job publishes it, once
          # the Linux app is attached too.
          releaseDraft: true
          # A tag with a dash (v0.9.0-rc1) is a pre-release: an app that is
          # not one itself, and has not asked for them, reads releases/latest
          # and never sees it (stack.rs wants_prereleases).
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
      # A configured signing that produced an unsigned installer is a failed
      # release, not a warning: the draft is never published.
      - name: The installer is signed by the expected publisher
        if: steps.codesign.outputs.enabled == 'true'
        shell: pwsh
        working-directory: app/src-tauri/target/release/bundle/nsis
        run: |
          $exe = Get-ChildItem -Filter '*_x64-setup.exe' | Select-Object -First 1
          if (-not $exe) { throw "no installer was built" }
          $sig = Get-AuthenticodeSignature -FilePath $exe.FullName
          Write-Host "$($exe.Name): $($sig.Status) -- $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "the installer is not validly signed: $($sig.StatusMessage)" }
      # The image manifest: the digest each image was pushed as, signed with
      # the same key as the installer, on the same release. The app verifies
      # it with its embedded public key before pulling (update.rs
      # verified_digests). Uploaded while the release is still a draft, so it
      # is there when the release goes live.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Write and sign the image manifest
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          node -e '
            const fs = require("fs");
            const images = {};
            for (const f of fs.readdirSync("digests")) {
              const [name, digest] = fs.readFileSync("digests/" + f, "utf8").trim().split(" ");
              if (!/^sha256:[0-9a-f]{64}$/.test(digest)) throw new Error(name + ": no digest was recorded");
              images[name] = digest;
            }
            for (const name of ["agent", "router", "reviewer", "sandbox"]) if (!images[name]) throw new Error(name + " has no digest");
            fs.writeFileSync("digests.json", JSON.stringify({ tag: process.argv[1], images }));
          ' "$TAG"
          cat digests.json
          (cd app && npx tauri signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ../digests.json)
          test -s digests.json.sig
      - name: Attach the image manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" digests.json digests.json.sig --clobber --repo "$GITHUB_REPOSITORY"

  # The Linux app: an AppImage, which updates itself like the Windows app,
  # and a .deb, which updates by installing the next one. Built on the
  # oldest Ubuntu the runners offer, so the AppImage's glibc is one most
  # distributions have. Built only: the files go to the draft in `publish`,
  # after the Windows job has made it, so the two never race to create the
  # release or to write latest.json.
  app-linux:
    name: Desktop app — Linux AppImage and .deb
    runs-on: ubuntu-22.04
    needs: [check, images]
    if: needs.check.outputs.published != 'true'
    # The updater key signs the AppImage; same environment, same reviewer.
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/src-tauri
      # Tauri 2's Linux build dependencies (its own prerequisites list); the
      # appindicator library is the tray icon's.
      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
        working-directory: app
      - name: Version the app after the tag
        working-directory: app
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          v="${TAG#v}"
          node -e 'const fs=require("fs");for (const f of ["src-tauri/tauri.conf.json","package.json"]){const j=JSON.parse(fs.readFileSync(f,"utf8"));j.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(j,null,2)+"\n")}' "$v"
          sed -i "0,/^version = \".*\"/s//version = \"$v\"/" src-tauri/Cargo.toml
          echo "app version $v"
      - name: Build
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TEKTONIX_RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: npx tauri build --bundles appimage,deb
      - name: Collect the files
        run: |
          mkdir linux-app
          cp app/src-tauri/target/release/bundle/appimage/*.AppImage app/src-tauri/target/release/bundle/appimage/*.AppImage.sig linux-app/
          cp app/src-tauri/target/release/bundle/deb/*.deb linux-app/
          ls -la linux-app
          test -s linux-app/*.AppImage.sig
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-app
          path: linux-app/
          if-no-files-found: error

  # Both apps are built: the Linux files join the Windows draft, latest.json
  # gains the Linux entry the AppImage's updater reads, and only then does
  # the release go public (immutable releases take no assets once public).
  publish:
    name: Publish the release
    runs-on: ubuntu-latest
    needs: [app-windows, app-linux]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-app
          path: linux-app
      - name: Attach the Linux app and add it to the update manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release upload "$TAG" linux-app/* --clobber --repo "$GITHUB_REPOSITORY"
          gh release download "$TAG" --pattern latest.json --dir manifest --repo "$GITHUB_REPOSITORY"
          node scripts/add_linux_to_updater_manifest.mjs manifest/latest.json linux-app "$GITHUB_REPOSITORY" "$TAG"
          gh release upload "$TAG" manifest/latest.json --clobber --repo "$GITHUB_REPOSITORY"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"

  # The installer as a user downloads it, verified from outside Windows: the
  # chain to Microsoft's code-signing root (pinned in the script), the
  # timestamp, and the publisher's name when ARTIFACT_SIGNING_PUBLISHER is
  # set. The job above already asked Windows before publishing; this asks
  # again of the file GitHub is actually serving.
  verify-published:
    name: The published installer verifies from outside
    runs-on: ubuntu-latest
    needs: [app-windows, publish]
    if: needs.app-windows.outputs.signed == 'true'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq osslsigncode
      - name: Verify the release's installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          PUBLISHER: ${{ vars.ARTIFACT_SIGNING_PUBLISHER }}
        run: scripts/verify_windows_installer.sh --release "$TAG" "$PUBLISHER"
